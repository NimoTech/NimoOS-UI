document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"zh-CN\" data-theme=\"dark\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>NimoOS 音频播放器 — 波形/说话人 设计工作稿<\u002Ftitle>\n<style>\n/* ══════════════════════════════════════════════════════════════════\n   主题 token(从 NimoOS-New-UI src/styles/theme.css 摘录的真实值)。\n   设计约束:最终实现里所有颜色都必须走这些 token(或新增 token),\n   且每个颜色 token 必须在 dark / light 两套主题里都有值。\n   ══════════════════════════════════════════════════════════════════ */\n:root, [data-theme=\"dark\"] {\n  --bg: #1a2138;\n  --fg: #ffffff;\n  --fg-muted: rgba(255, 255, 255, 0.74);\n  --fg-faint: rgba(255, 255, 255, 0.52);\n  --fg-subtle: rgba(255, 255, 255, 0.4);\n  --accent: #8ab4ff;\n  --accent2: #b79bff;\n  --accent-text: #a9c6ff;\n  --accent-soft: rgba(138, 180, 255, 0.14);\n  --accent-soft-bd: rgba(138, 180, 255, 0.36);\n  --border: rgba(255, 255, 255, 0.14);\n  --hover: rgba(255, 255, 255, 0.08);\n  --hl-bg: rgba(232, 192, 106, 0.16);   /* 现行「重点句」金色底 —— 本次设计要取消颜色区分 */\n  --hl-star: #e8c06a;                    /* 星标图标沿用金色;重点句不再用底色区分 */\n  /* 说话人配色(最多 5 色循环;色相分明、明度/彩度一致,dark 用亮版,避开金色以免与星标混淆)*/\n  --spk-1: oklch(0.74 0.13 250);   /* 蓝 · Instructor */\n  --spk-2: oklch(0.72 0.13 305);   /* 紫 · Student */\n  --spk-3: oklch(0.77 0.12 190);   /* 青 */\n  --spk-4: oklch(0.73 0.15 18);    /* 珊瑚 */\n  --spk-5: oklch(0.79 0.14 150);   /* 绿 */\n  --wave-none: var(--fg-subtle);   /* 静场 / 无人声 */\n  --wave-dim: var(--fg-faint);     /* 过滤时被弱化的竖条 */\n  --page-bg: linear-gradient(160deg, #10162a 0%, #1a2138 55%, #232a4d 100%);\n  --card-shadow-hi: 0 18px 60px rgba(0, 0, 0, 0.5);\n  --ease: cubic-bezier(0.16, 1, 0.3, 1);\n}\n[data-theme=\"light\"] {\n  --bg: #f7f5ef;\n  --fg: #1c1b19;\n  --fg-muted: #6e6a61;\n  --fg-faint: #9a958a;\n  --fg-subtle: #9a958a;\n  --accent: #3b5bdb;\n  --accent2: #6e5ae0;\n  --accent-text: #3550c4;\n  --accent-soft: rgba(59, 91, 219, 0.11);\n  --accent-soft-bd: rgba(59, 91, 219, 0.32);\n  --border: #e7e3d9;\n  --hover: rgba(28, 27, 25, 0.045);\n  --hl-bg: #fdf4d9;\n  --hl-star: #c9992f;\n  --spk-1: oklch(0.52 0.15 255);\n  --spk-2: oklch(0.50 0.16 305);\n  --spk-3: oklch(0.53 0.12 200);\n  --spk-4: oklch(0.55 0.18 22);\n  --spk-5: oklch(0.52 0.15 150);\n  --wave-none: var(--fg-subtle);\n  --wave-dim: var(--fg-faint);\n  --page-bg: linear-gradient(160deg, #f2efe6 0%, #f7f5ef 60%, #edf0fa 100%);\n  --card-shadow-hi: 0 4px 10px rgba(60, 50, 30, 0.08), 0 40px 70px -22px rgba(60, 50, 30, 0.34);\n}\n\n* { box-sizing: border-box; margin: 0; }\nbody {\n  min-height: 100vh; padding: 32px 20px 80px;\n  background: var(--page-bg); color: var(--fg);\n  font-family: -apple-system, \"PingFang SC\", \"Segoe UI\", Roboto, sans-serif;\n  display: flex; flex-direction: column; align-items: center; gap: 26px;\n}\n.stage { width: 100%; max-width: 60rem; display: flex; flex-direction: column; gap: 26px; }\n\n/* ── 设计任务说明卡 ─────────────────────────────────────────────── */\n.brief {\n  border: 1px solid var(--border); border-radius: 16px; padding: 20px 24px;\n  background: var(--bg); box-shadow: var(--card-shadow-hi);\n  font-size: 14px; line-height: 1.75; color: var(--fg-muted);\n}\n.brief h1 { font-size: 17px; color: var(--fg); margin-bottom: 8px; }\n.brief b { color: var(--fg); }\n.brief code { font-family: ui-monospace, monospace; font-size: 12.5px; background: var(--hover); padding: 1px 6px; border-radius: 6px; }\n.brief ol { padding-left: 20px; }\n.theme-btn {\n  float: right; margin-left: 12px; cursor: pointer; padding: 6px 14px; border-radius: 999px;\n  border: 1px solid var(--border); background: transparent; color: var(--fg-muted); font-size: 13px;\n}\n\n/* ══════════════════════════════════════════════════════════════════\n   ▼▼ 以下是「现有播放器」的 1:1 视觉还原(样式抄自 MediaViewer.vue)▼▼\n   ══════════════════════════════════════════════════════════════════ */\n.np { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 28px 22px;\n      border: 1px solid var(--border); border-radius: 20px; background: var(--bg); box-shadow: var(--card-shadow-hi); }\n.np-title { font-size: 16px; font-weight: 600; color: var(--fg); }\n\n.np-controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; max-width: 40rem; }\n.np-center { display: flex; align-items: center; justify-content: center; gap: 12px; }\n.np-side { display: flex; align-items: center; min-width: 0; }\n.np-side-right { justify-content: flex-end; }\n.np-skip { position: relative; width: 44px; height: 44px; border-radius: 50%; cursor: pointer;\n  display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--fg-muted); }\n.np-skip:hover { background: var(--hover); color: var(--fg); }\n.np-skip svg { width: 30px; height: 30px; fill: currentColor; }\n.np-skip-fwd svg { transform: scaleX(-1); }\n.np-skip-n { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);\n  font-size: 10px; font-weight: 700; line-height: 1; pointer-events: none; }\n.np-play { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;\n  display: flex; align-items: center; justify-content: center;\n  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }\n.np-play svg { width: 26px; height: 26px; fill: currentColor; }\n.np-play svg.tri { margin-left: 3px; }\n.np-speed { min-width: 46px; padding: 6px 12px; border-radius: 999px; cursor: pointer;\n  font-size: 14px; font-weight: 700; background: transparent; border: 1px solid var(--border); color: var(--fg-muted); }\n\n.np-bar-row { display: flex; align-items: center; gap: 14px; width: 100%; }\n.np-time { flex: 0 0 auto; min-width: 46px; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--fg-muted); }\n.np-time-end { text-align: right; }\n\n/* ── 声波进度条(设计重点区)──────────────────────────────────────\n   96 根竖条(flex 均布,固定 3px 圆头),中央虚线基线,已播=.played。\n   每根 bar 还带说话人 class:spk-s1 / spk-s2 / spk-none(静场/无人声)。\n   ▶ 设计任务:让「按说话人着色」和「已播进度」同时清晰可读。\n   下面是现行样式;spk-* 目前没有样式,等你来定。 */\n.np-wave { position: relative; flex: 1 1 auto; height: 46px; min-width: 0;\n  display: flex; align-items: center; justify-content: space-between; cursor: pointer; }\n.np-wave-base { position: absolute; left: 0; right: 0; top: 50%; height: 0;\n  border-top: 1px dashed var(--fg-faint); transform: translateY(-50%); pointer-events: none; }\n.np-wave-bar { position: relative; flex: 0 1 3px; max-width: 3px; border-radius: 999px;\n  background: var(--bar-c, var(--fg-subtle)); opacity: 0.30;\n  transition: background 0.14s, opacity 0.14s, filter 0.14s, height 0.3s var(--ease); }\n/* 进度 = 不透明度:已播满色、未播同色淡出 —— 说话人配色与播放进度同时可读 */\n.np-wave-bar.played { opacity: 1; }\n/* 每根竖条按说话人取色 */\n.np-wave-bar.spk-s1 { --bar-c: var(--spk-1); }\n.np-wave-bar.spk-s2 { --bar-c: var(--spk-2); }\n.np-wave-bar.spk-none { --bar-c: var(--wave-none); }\n/* 过滤:未选中说话人的竖条去色转灰并进一步压暗,只留选中者的颜色跳出来 */\n.np-wave-bar.dim { --bar-c: var(--wave-dim); opacity: 0.12; }\n.np-wave-bar.dim.played { opacity: 0.30; }\n.np-wave:hover .np-wave-bar.played:not(.dim) { filter: brightness(1.12); }\n\n/* ══════════════════════════════════════════════════════════════════\n   ▼▼ 转录面板(节选还原)+ 说话人过滤 chips(新增,待设计)▼▼\n   ══════════════════════════════════════════════════════════════════ */\n.panel { display: flex; flex-direction: column; border-radius: 20px; border: 1px solid var(--border);\n  background: var(--bg); box-shadow: var(--card-shadow-hi); overflow: hidden; max-height: 520px; }\n.ap-tools { display: flex; align-items: center; gap: 8px; padding: 16px 18px 10px; flex-wrap: wrap; }\n.ap-tool { padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;\n  background: transparent; border: 1px solid var(--border); color: var(--fg-muted); }\n.ap-tool.on { background: var(--accent-soft); border-color: var(--accent-soft-bd); color: var(--accent-text); }\n/* ── 说话人过滤 chip(占位样式,待你重设计;点击可用,全不选=显示全部)── */\n.spk-chip { display: inlin ou're trying to mix like a Sabrina Carpenter record\"},{\"t\":\"23:20\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"No, not so much, right? So, just something to be aware of, g\"},{\"t\":\"23:37\",\"speaker\":\"s1\",\"highlight\":true,\"text\":\"So, we are going to have something called the bit depth. So,\"},{\"t\":\"24:01\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"We can record on or off, basically, at one bit, right? And t\"},{\"t\":\"24:15\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, now we can have off-off, on-off, off-on, on-off, right? \"},{\"t\":\"24:33\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"And so, for digital audio, we're generally starting, startin\"},{\"t\":\"24:55\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"At 24 bit, which is the minimum for most things these days, \"},{\"t\":\"25:13\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, in this case, we're going from 96 decibels up to 144 dec\"},{\"t\":\"25:31\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, we're able to be very, very, very precise. So, along wit\"},{\"t\":\"25:49\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, looking at this particular diagram, we have, okay, this \"},{\"t\":\"26:07\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah. Is it going to sound like a perfect sine wave? Like, i\"},{\"t\":\"26:21\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, 2 to the power of 3. So, 2 times 2 is 4 times 2 is 8. So\"},{\"t\":\"26:46\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, is that going to sound like a sine wave? No, this is goi\"},{\"t\":\"26:55\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"But it's going to add something called quantization noise, w\"},{\"t\":\"27:08\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"It's like it's bad, right? Are there some cases where maybe \"},{\"t\":\"27:22\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah. It's probably best you don't see it, honestly. It's no\"},{\"t\":\"27:35\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"And say, surely you can imagine cases where you're doing sou\"},{\"t\":\"27:40\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, finally, let's talk a little bit about file formats, bec\"},{\"t\":\"27:57\",\"speaker\":\"s1\",\"highlight\":true,\"text\":\"And so, an uncompressed file is going to have no loss to the\"},{\"t\":\"28:11\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"No reduction in audio quality. So, naturally, why would I wa\"},{\"t\":\"28:29\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"But then there's another concern here. So, for long-term sto\"},{\"t\":\"28:43\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Even if you do eventually export two different file formats \"},{\"t\":\"29:07\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah?\"},{\"t\":\"29:08\",\"speaker\":\"s2\",\"highlight\":false,\"text\":\"Is WAV, like, Windows? And, like, AIFF is for Mac?\"},{\"t\":\"29:12\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"That's exactly correct. Yeah. So, WAV is, like, Windows Audi\"},{\"t\":\"29:27\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"And if you were cool like me and you had a creative zen, rig\"},{\"t\":\"29:41\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"For sure, you can play any file format. On Windows, generall\"},{\"t\":\"29:56\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Which means that you will, like, sometimes have a colleague \"},{\"t\":\"30:12\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Until you do.\"},{\"t\":\"30:14\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"In any case, then we have compressed file formats. So, the i\"},{\"t\":\"30:30\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, I don't like lossy. I think that sounds like something s\"},{\"t\":\"30:43\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, for example. Something like a Microsoft Word document. O\"},{\"t\":\"31:00\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"As well as the RGBA values for just the letter A and just th\"},{\"t\":\"31:21\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"And we are using this font. So, reference this file somewher\"},{\"t\":\"31:35\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Right? That is on the slide. It's basically the same thing f\"},{\"t\":\"31:52\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"You would have to actually go through a conversion process t\"},{\"t\":\"32:05\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, FLAC files, I will say, I don't see them very often outs\"},{\"t\":\"32:23\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Right? Because surely no one spends that much money on Bandc\"},{\"t\":\"32:31\",\"speaker\":\"s1\",\"highlight\":true,\"text\":\"Now, next we have compressed lossy file formats. So, this me\"},{\"t\":\"32:47\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, how many people have heard of MP3? Yeah, surely all of y\"},{\"t\":\"33:01\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"That's wild, right? So, in any case. Basically, this was the\"},{\"t\":\"33:17\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"You just want to get the gist of it and be able to, like, li\"},{\"t\":\"33:32\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Except it's... I don't know why you bought it with M4A, but \"},{\"t\":\"33:50\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah, so where have you guys seen OGG files?\"},{\"t\":\"33:53\",\"speaker\":\"s2\",\"highlight\":false,\"text\":\"I see a lot, like, relations with new games?\"},{\"t\":\"33:56\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah, exactly. So, this is, like, a compression format that'\"},{\"t\":\"34:15\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Whether that's because it's something that we're streaming o\"},{\"t\":\"34:29\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, along with that, though, there are differences. So, ther\"},{\"t\":\"34:47\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, just go ahead and get those, these sound examples. For w\"},{\"t\":\"35:51\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, not necessarily my favorite composer. For those of you w\"},{\"t\":\"36:09\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, we're going to start with, this is an AIF file. And this\"},{\"t\":\"36:58\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, if we remember, this is going to be the difference betwe\"},{\"t\":\"37:48\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yep.\"},{\"t\":\"37:49\",\"speaker\":\"s2\",\"highlight\":false,\"text\":\"I think it sounds pretty similar, but during some of the lou\"},{\"t\":\"37:57\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yep. Anyone else hear any big differences? Yep. Oh, like the\"},{\"t\":\"38:25\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"It's just, it's pretty subtle at this point, right? So, for \"},{\"t\":\"38:39\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, now we're going to go down to 8 bit. So, how many steps \"},{\"t\":\"39:08\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"So, 256, notable for being much less than 65,000, right? So,\"},{\"t\":\"39:55\",\"speaker\":\"s2\",\"highlight\":false,\"text\":\"It's a lot of static.\"},{\"t\":\"39:56\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah.\"},{\"t\":\"39:57\",\"speaker\":\"s2\",\"highlight\":false,\"text\":\"Especially the lower notes from here.\"},{\"t\":\"39:59\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah, exactly. We get all this quantization noise. So, it's \"},{\"t\":\"40:14\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Yeah, that doesn't sound fun, right? But, again, value judgm\"},{\"t\":\"40:29\",\"speaker\":\"s1\",\"highlight\":false,\"text\":\"Now, from here, we're going to go from Mahler at 24 bit AIF.\"}]\n\n// ── 波形生成:与线上 waveform.ts 相同的合成算法(seed 定形状,仅供设计;线上是真实解码峰值)──\nconst WAVE_N = 96\nfunction hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) } return h >>> 0 }\nfunction mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }\nfunction synthWaveform(seed, n) {\n  const rnd = mulberry32(hashStr(seed)); const amps = []\n  while (amps.length < n) {\n    if (rnd() < 0.22) { const gap = 2 + Math.floor(rnd() * 4); for (let k = 0; k < gap && amps.length < n; k++) amps.push(0) }\n    else { const len = 5 + Math.floor(rnd() * 16), peak = 0.35 + rnd() * 0.65\n      for (let k = 0; k < len && amps.length < n; k++) { const env = Math.sin((k / Math.max(1, len - 1)) * Math.PI); amps.push(Math.min(1, Math.max(0.08, env * peak * (0.7 + rnd() * 0.5)))) } }\n  }\n  return amps\n}\nconst parseT = (t) => { const [m, s] = t.split(':').map(Number); return m * 60 + s }\n\n// 每根竖条 → 覆盖该竖条时间窗 [a,b] 内「说话时长最多」的人。\n// 说明:每根竖条约占 25s,而学生插话往往只有几秒;若只按中点采样会丢失短发言,\n// 所以按时长占比取主导说话人 —— 线上实现同理(用真实分段时间轴而非合成时间)。\nconst SPK_FREQ = SEGMENTS.reduce((m, s) => (m[s.speaker] = (m[s.speaker] || 0) + 1, m), {})\nfunction speakerForWindow(a, b) {\n  const present = new Set()\n  for (let i = 0; i < SEGMENTS.length; i++) {\n    const start = parseT(SEGMENTS[i].t)\n    const end = i + 1 < SEGMENTS.length ? parseT(SEGMENTS[i + 1].t) : DURATION\n    if (Math.min(b, end) - Math.max(a, start) > 0) present.add(SEGMENTS[i].speaker)\n  }\n  if (!present.size) return null\n  // 少数说话人优先:窗口内出现的说话人里,取全局发言次数最少的那位着色,\n  // 保证像「学生 2 秒插话」这类短发言也能在波形上留下一根有色竖条、不被平均掉。\n  // 线上可换成「时长占主导」或设阈值,颜色/交互不变。\n  return [...present].sort((x, y) => SPK_FREQ[x] - SPK_FREQ[y])[0]\n}\n\n// ── 渲染波形 ──\nconst wave = document.getElementById('wave')\nconst bars = synthWaveform('new recording 21.m4a', WAVE_N)\nlet progress = 0.38  // 已播比例,点击波形可改\nconst picked = new Set()  // 被选中的说话人(空 = 显示全部)\nfunction renderWave() {\n  wave.querySelectorAll('.np-wave-bar').forEach((el) => el.remove())\n  bars.forEach((a, i) => {\n    const el = document.createElement('i')\n    const sp = speakerForWindow((i / WAVE_N) * DURATION, ((i + 1) / WAVE_N) * DURATION)\n    const dim = picked.size && (!sp || !picked.has(sp)) ? ' dim' : ''\n    el.className = 'np-wave-bar spk-' + (sp || 'none') + (i < Math.round(progress * WAVE_N) ? ' played' : '') + dim\n    el.style.height = a * 100 + '%'\n    wave.appendChild(el)\n  })\n  document.getElementById('cur').textContent = (() => { const s = Math.round(progress * DURATION); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') })()\n}\nwave.addEventListener('click', (e) => { const r = wave.getBoundingClientRect(); progress = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); renderWave() })\nrenderWave()\n\n// ── 渲染说话人 chips(「全部」+ 多选过滤;点「全部」= 清空筛选显示全部)──\nconst chipsEl = document.getElementById('chips')\nlet hlOnly = false\nconst allChip = document.createElement('button')\nallChip.className = 'spk-chip spk-chip-all on'\nallChip.textContent = '全部'\nallChip.onclick = () => { if (!picked.size) return; picked.clear(); syncChips(); renderWave(); renderList() }\nchipsEl.appendChild(allChip)\nconst spkChips = SPEAKERS.map((sp) => {\n  const b = document.createElement('button')\n  b.className = 'spk-chip'\n  b.dataset.spk = sp.id\n  b.style.setProperty('--c', spkVar(sp.id))\n  b.innerHTML = '<span class=\"dot\"><\u002Fspan>' + sp.name\n  b.onclick = () => { picked.has(sp.id) ? picked.delete(sp.id) : picked.add(sp.id); syncChips(); renderWave(); renderList() }\n  chipsEl.appendChild(b)\n  return b\n})\nfunction syncChips() {\n  allChip.classList.toggle('on', picked.size === 0)\n  spkChips.forEach((b) => b.classList.toggle('on', picked.has(b.dataset.spk)))\n}\ndocument.getElementById('hlOnly').onclick = function () { hlOnly = !hlOnly; this.classList.toggle('on'); renderList() }\n\n// ── 渲染转录列表 ──\nconst list = document.getElementById('list')\nconst STAR = '<svg class=\"ap-hl-star\" viewBox=\"0 0 24 24\"><path d=\"M12 3.5l2.6 5.7 6.2.6-4.7 4.1 1.4 6.1L12 16.9 6.5 20.1l1.4-6.1L3.2 9.8l6.2-.6z\"/><\u002Fsvg>'\nfunction renderList() {\n  list.innerHTML = ''\n  for (const s of SEGMENTS) {\n    if (picked.size && !picked.has(s.speaker)) continue\n    if (hlOnly && !s.highlight) continue\n    const name = (SPEAKERS.find((x) => x.id === s.speaker) || {}).name || ''\n    const li = document.createElement('li')\n    li.className = 'ap-seg' + (s.highlight ? ' hl' : '')\n    li.innerHTML = '<span class=\"ap-time\">' + s.t + '<\u002Fspan><span class=\"ap-seg-body\">'\n      + '<span class=\"ap-speaker\" style=\"--c:' + spkVar(s.speaker) + '\"><span class=\"dot\"><\u002Fspan>' + name + '<\u002Fspan>'\n      + '<span class=\"ap-seg-text\">' + (s.highlight ? STAR : '') + s.text + '…<\u002Fspan><\u002Fspan>'\n    list.appendChild(li)\n  }\n}\nrenderList()\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
