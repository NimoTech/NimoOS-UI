<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NimoOS</title>
    <script>
      // Anti-flash: apply data-theme before the JS bundle loads (matches src/stores/theme.ts logic)
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (e) { /* silently fall back to default blue when localStorage is unavailable */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
